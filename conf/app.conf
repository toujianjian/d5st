// Casdoor 官方配置文件（容器内路径 /conf/app.conf）
// 参考: https://github.com/casdoor/casdoor/blob/master/conf/app.conf

appname = casdoor
runname = d5st-casdoor
httpport = 8000
httpaddr = 0.0.0.0

// ── MySQL 数据库（容器内用 mysql:3306，不是 localhost）──
driverName = mysql
dataSourceName = ${MYSQL_USER:-d5st}:${MYSQL_PASSWORD:-d5st_pass_2026}@tcp(mysql:3306)/
dbName = casdoor

// ── 日志 ──
logFile =
consoleLog = false

// ── 存储 ──
defaultStorageProvider =

// ── 管理员默认（首次启动 Casdoor 会创建 built-in 组织 + admin/123）──
isDemoMode = false
sessionOn = true

// ── 启用 Casdoor 自动建表 ──
// 通过 entrypoint ./server --createDatabase=true 实现
