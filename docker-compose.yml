services:
  mysql:
    image: mysql:8.0
    container_name: d5st-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-d5st_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-d5st}
      MYSQL_USER: ${MYSQL_USER:-d5st}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-d5st_pass_2026}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      # 显式设置默认时区，避免镜像内 TZ env 未生效导致全部时间 +8 小时
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-schema.sql:/docker-entrypoint-initdb.d/01-d5st-schema.sql:ro
      - ./docker/casdoor-init.sql:/docker-entrypoint-initdb.d/02-casdoor-schema.sql:ro
    networks:
      - d5st-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-d5st_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  casdoor:
    # 自定义镜像：基于官方镜像，给自带前端打 /casdoor 子路径补丁（见 docker/casdoor/Dockerfile）
    build:
      context: .
      dockerfile: docker/casdoor/Dockerfile
    container_name: d5st-casdoor
    restart: unless-stopped
    # 镜像无 wget/curl 做 healthcheck；MySQL 偶尔比 casdoor 慢一拍，
    # 这里用 shell 循环重试：启动失败（连接被拒会 panic 退出）就 sleep 后重试，
    # 直到 MySQL 就绪能常驻为止。
    entrypoint: ["/bin/sh", "-c", "set +e; while true; do ./server --createDatabase=true; echo \"[casdoor] server 退出 (code $?)，5s 后重试\"; sleep 5; done"]
    environment:
      driverName: mysql
      dataSourceName: "${MYSQL_USER:-d5st}:${MYSQL_PASSWORD:-d5st_pass_2026}@tcp(mysql:3306)/"
      dbName: casdoor
      GIN_MODE: release
      TZ: Asia/Shanghai
    # 不再直连对外：统一由 Caddy 在 /casdoor 子路径暴露
    volumes:
      - casdoor_data:/data
    depends_on:
      mysql:
        condition: service_healthy
    # Casdoor 镜像无 wget/curl，用 sh 内置的 /dev/tcp 探测 8000 端口是否就绪；
    # 配合 app 的 service_healthy 依赖，避免 app 抢跑时 Casdoor 尚未监听。
    healthcheck:
      test: ["CMD", "sh", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - d5st-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: d5st-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${APP_PORT:-35555}
      HOST: 0.0.0.0
      USE_MYSQL: "1"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-d5st}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-d5st_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-d5st}
      CASDOOR_ENDPOINT: ${CASDOOR_ENDPOINT:-http://d5st-casdoor:8000}
      # 用户浏览器实际跳转的 Casdoor 公网地址；本地开发填 http://localhost:8000
      # 用户浏览器实际跳转的 Casdoor 公网地址；经 Caddy 统一入口的 /casdoor 子路径
      CASDOOR_PUBLIC_ENDPOINT: ${CASDOOR_PUBLIC_ENDPOINT:-http://localhost:8080/casdoor}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-d5st_client}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:-d5st_client_secret_2026}
      CASDOOR_ORGANIZATION: ${CASDOOR_ORGANIZATION:-d5st}
      CASDOOR_APPLICATION: ${CASDOOR_APPLICATION:-d5st-app}
      CASDOOR_WEBHOOK_SECRET: ${CASDOOR_WEBHOOK_SECRET:-d5st_webhook_secret_2026}
      CASDOOR_ADMIN_USER: ${CASDOOR_ADMIN_USER:-admin}
      # Casdoor 内建管理员(built-in/admin)默认密码为 123，
      # 必须与 Casdoor 实际 admin 密码一致，否则应用拿不到管理员会话，
      # 无法自动创建组织/应用/Webhook，登录链路会整体失效。
      CASDOOR_ADMIN_PASSWORD: ${CASDOOR_ADMIN_PASSWORD:-123}
      # 本站默认管理员（d5st 组织下的普通用户，自动加入 d5st-admin 组）
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-d5stadmin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-d5stpassword}
      # 本站对外地址（用于拼接 OAuth 回调）；经 Caddy 统一入口
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-d5st_session_secret_change_in_production}
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-0}
      TZ: Asia/Shanghai
    # 不再直连对外：统一由 Caddy 在根路径暴露
    depends_on:
      mysql:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    # 不挂载宿主目录：代码全部烘焙进镜像，
    # 避免宿主/容器之间的路径与换行符差异带来的迁移兼容问题
    networks:
      - d5st-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-35555}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: d5st-caddy
    restart: unless-stopped
    # 统一入口：浏览器只访问本端口，按路径分流
    #   /casdoor/* -> 剥离前缀转发到 Casdoor(后端根路径服务)
    #   /          -> d5st 应用
    ports:
      - "${EXTERNAL_PORT:-8080}:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - d5st-network

volumes:
  mysql_data:
  casdoor_data:

networks:
  d5st-network:
    driver: bridge
